apiVersion: apps/v1
kind: Deployment
metadata:
	name: flask-app
	labels:
		app: flask-app

spec:
	replicas: 2

	selector:
		matchLabels:
			app: flask-app

	template:
		metadata:
			labels:
				app: flask-app

		spec:
			containers:
				- name: flask-container
					image: penhass9/flask-app:v1.0
					ports:
						- containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: flask-service
spec:
  type: NodePort
  selector:
    app: flask
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000					
